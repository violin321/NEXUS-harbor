services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexus_harbor
    restart: unless-stopped

  poller:
    build:
      context: .
      dockerfile: Dockerfile
      target: poller
    command: ["pnpm", "poller:start"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      NODE_ENV: production
      POLLER_INTERVAL_MS: 300000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexus_harbor
    restart: unless-stopped
    profiles:
      - poller

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus_harbor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/seeds/demo-compose.sql:/docker-entrypoint-initdb.d/02_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_harbor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
